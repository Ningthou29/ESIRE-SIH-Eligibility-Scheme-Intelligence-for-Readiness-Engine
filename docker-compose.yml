services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: PAANGBA
      POSTGRES_PASSWORD: PAANGBA
      POSTGRES_DB: PAANGBA
    ports:
      - "5432:5432"
    volumes:
      - PAANGBA_pg:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - PAANGBA_mongo:/data/db

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/PAANGBA-dev-password
    volumes:
      - PAANGBA_neo4j:/data

volumes:
  PAANGBA_pg:
  PAANGBA_mongo:
  PAANGBA_neo4j:
